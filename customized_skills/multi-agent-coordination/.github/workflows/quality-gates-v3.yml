name: Quality Gates v3.0 - AST-Based

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    
    - name: Run Quality Gates v3.0
      run: |
        python -c "
        import sys
        import os
        import warnings
        warnings.filterwarnings('ignore')
        
        sys.path.insert(0, '.')
        from quality_gates_v3 import enforce_quality, QualityError, CheckStatus
        
        # 获取所有Python文件
        python_files = []
        for root, dirs, files in os.walk('.'):
            # 跳过隐藏目录和测试目录
            dirs[:] = [d for d in dirs if not d.startswith('.') and d != '__pycache__']
            for file in files:
                if file.endswith('.py') and not file.startswith('test_'):
                    python_files.append(os.path.join(root, file))
        
        print('='*70)
        print('Quality Gates v3.0 - AST-Based Deep Review')
        print('='*70)
        print(f'Checking {len(python_files)} Python files...')
        print('='*70)
        
        failed = []
        passed = []
        
        for file_path in sorted(python_files):
            try:
                with open(file_path, 'r', encoding='utf-8') as f:
                    code = f.read()
                
                if not code.strip():
                    continue
                
                report = enforce_quality(code, file_path, min_score=9.0)
                
                if report.overall_status == CheckStatus.PASS:
                    print(f'[PASS] {file_path}: {report.overall_score:.1f}/10')
                    passed.append((file_path, report.overall_score))
                else:
                    print(f'[{report.overall_status.value.upper()}] {file_path}: {report.overall_score:.1f}/10')
                    if report.overall_score < 9.0:
                        failed.append(file_path)
                        
            except Exception as e:
                print(f'[ERROR] {file_path}: {e}')
                failed.append(file_path)
        
        print('='*70)
        print(f'Results: {len(passed)} passed, {len(failed)} failed')
        
        if passed:
            avg_score = sum(s for _, s in passed) / len(passed)
            print(f'Average Score: {avg_score:.2f}/10')
        
        print('='*70)
        
        if failed:
            print(f'\\n[FAIL] Quality check failed for {len(failed)} files:')
            for f in failed[:10]:  # 最多显示10个
                print(f'  - {f}')
            if len(failed) > 10:
                print(f'  ... and {len(failed) - 10} more')
            sys.exit(1)
        
        print('\\n[PASS] All quality checks passed!')
        sys.exit(0)
        "
    
    - name: Upload Quality Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: quality-report-v3
        path: quality_report.json
